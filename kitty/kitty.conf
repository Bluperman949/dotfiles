#
#  kitty.conf
#

### APPEARANCE ###
font_family      family='JetBrainsMonoNL Nerd Font' style='Regular'
bold_font        family='JetBrainsMonoNL Nerd Font' style='Bold'
italic_font      family='JetBrainsMonoNL Nerd Font' style='Italic'
bold_italic_font family='JetBrainsMonoNL Nerd Font' style='Bold Italic'
font_size        12
# TODO: symbol_map nerdfont characters

include gruvbox.conf

enabled_layouts grid

tab_bar_align left
tab_bar_edge top
tab_title_template "{index} {tab.active_oldest_exe}"
tab_bar_style slant
active_tab_font_style normal
inactive_tab_font_style normal

### MISC ###
enable_audio_bell no

editor '/usr/bin/nvim'
shell  '/usr/bin/zsh'

allow_remote_control yes
listen_on unix:@mykitty

### KEYBINDS ###

## nops
map ctrl+tab nop
map kitty_mod+w nop
map kitty_mod+a nop
map kitty_mod+s nop
map kitty_mod+d nop

## ui & navigation
map kitty_mod+enter new_os_window_with_cwd
map alt+enter new_window_with_cwd
map alt+backspace close_window

map alt+shift+w move_window up
map alt+shift+a move_window left
map alt+shift+s move_window down
map alt+shift+d move_window right
map alt+w neighboring_window up
map alt+a neighboring_window left
map alt+s neighboring_window down
map alt+d neighboring_window right

map --when-focus-on var:IS_VIM=true alt+w
map --when-focus-on var:IS_VIM=true alt+a
map --when-focus-on var:IS_VIM=true alt+s
map --when-focus-on var:IS_VIM=true alt+d

map alt+t new_tab_with_cwd
map alt+tab next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map kitty_mod+- change_font_size active -2.0
map kitty_mod+= change_font_size active +2.0

## kitty meta
map kitty_mod+r load_config_file

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map ctrl+l clear_terminal to_cursor_scroll active
